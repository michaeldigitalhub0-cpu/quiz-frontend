<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Quiz Management System</title>
  <link rel="stylesheet" href="../../css/setting.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/quiz.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <div class="sidebar__brand">Quiz<span>MS</span></div>
        <a href="./settings.html" class="sidebar__settings is-active" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </a>
      </div>
      <p class="sidebar__section-label">Overview</p>
      <ul class="sidebar__nav">
        <li><a href="./courses.html" class="sidebar__link">Department</a></li>
      </ul>
    </aside>

    <header class="topbar">
      <div class="topbar__left">
        <h2 class="topbar__title">Settings</h2>
      </div>
      <div class="topbar__user">
        <span class="role-pill" id="userRole">HOD</span>
        <span id="userName">—</span>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main class="main">
      <div id="pageAlert"></div>

      <div class="settings-layout">

        <!-- Read-only account details -->
        <section class="card settings-details">
          <div class="card__header">
            <h3>Account details</h3>
          </div>
          <p class="settings-note">
            Managed by the school office. Ask an administrator if something needs correcting.
          </p>
          <div class="form-grid">
            <div class="field">
              <label for="detailId">User ID</label>
              <input type="text" id="detailID" class="col-id" disabled />
            </div>
            <div class="field">
              <label for="detailName">Full name</label>
              <input type="text" id="detailName" disabled />
            </div>
            <div class="field">
              <label for="detailRole">Role</label>
              <input type="text" id="detailRole" disabled />
            </div>
            <div class="field">
              <label for="detailContact">Email</label>
              <input type="email" id="detailEmail" disabled />
            </div>
          </div>
        </section>

        <div class="settings-stack">

          <section class="card">
            <div class="card__header">
              <h3>Contact</h3>
            </div>
            <form id="contactForm" novalidate>
              <div class="form-grid">
                <div class="field" id="contactField">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" autocomplete="email" inputmode="email"
                    placeholder="example@email.com" required />
                  <span class="field__error" id="emailError"></span>
                </div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="saveEmailBtn">Save Email</button>
              </div>
            </form>
          </section>

          <section class="card">
            <div class="card__header">
              <h3>Password</h3>
            </div>
            <form id="passwordForm" novalidate>
              <div class="form-grid">
                <div class="field" id="currentPasswordField">
                  <label for="currentPassword">Current password</label>
                  <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password"
                    required />
                  <span class="field__error" id="currentPasswordError"></span>
                </div>
                <div class="field" id="newPasswordField">
                  <label for="newPassword">New password</label>
                  <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8"
                    required />
                  <span class="field__hint">At least 8 characters, no space allowed.</span>
                  <span class="field__error" id="newPasswordError"></span>
                </div>
                <div class="field" id="confirmPasswordField">
                  <label for="confirmPassword">Confirm new password</label>
                  <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password"
                    required />
                  <span class="field__error" id="confirmPasswordError"></span>
                </div>
              </div>
              <div class="field settings-toggle">
                <label class="settings-toggle__label">
                  <input type="checkbox" id="showPasswords" />
                  Show passwords
                </label>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="savePasswordBtn">Change password</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
              </div>
            </form>
          </section>

        </div>
      </div>
    </main>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="../../js/pages/hod/settings.js"></script>

</body>

</html>
