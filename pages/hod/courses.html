<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses — Quiz Management System</title>
  <link rel="stylesheet" href="../../css/setting.css" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/quiz.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <div class="sidebar__brand">Quiz<span>MS</span></div>
        <a href="./settings.html" class="sidebar__settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </a>
      </div>
      <p class="sidebar__section-label">Department</p>
      <ul class="sidebar__nav">
        <li><a href="courses.html" class="sidebar__link is-active">Courses</a></li>
      </ul>
    </aside>

    <header class="topbar">
      <h2 class="topbar__title">Courses</h2>
      <div class="topbar__user">
        <span class="role-pill" id="userRole">HOD</span>
        <span id="userName">—</span>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main class="main">
      <div id="pageAlert"></div>
      <section class="stat-grid">
        <div class="stat-card">
          <div class="stat-card__value" id="statCourses">—</div>
          <div class="stat-card__label">Courses</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="statInstructors">—</div>
          <div class="stat-card__label">Instructors</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value" id="statStudents">—</div>
          <div class="stat-card__label">Enrolled students</div>
        </div>
      </section>

      <section class="card">
        <div class="card__header">
          <h3 style="margin:0;">Create a course</h3>
        </div>
        <form id="courseForm">
          <div class="form-grid">
            <div class="field"><label for="courseCode">Course code</label><input type="text" id="courseCode"
                maxlength="7" placeholder="e.g. CSC4010" required /></div>
            <div class="field"><label for="courseTitle">Course title</label><input type="text" id="courseTitle"
                maxlength="100" required /></div>
            <div class="field"><label for="courseInstructor">Instructor</label><select id="courseInstructor">
                <option value="" disabled selected>Select instructor</option>
              </select></div>
          </div>
          <div class="form-actions"><button type="submit" class="btn btn-primary">Create course</button></div>
        </form>
      </section>

      <section class="card">
        <div class="table-toolbar">
          <h3 style="margin:0;">All courses</h3><input type="search" id="courseSearch"
            placeholder="Search by code or title" />
        </div>
        <p class="note">Change a course's instructor with the dropdown, then press Save on that row.</p>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Code</th>
                <th>Title</th>
                <th>Instructor</th>
                <th class="num">Students</th>
                <th class="num">Quizzes</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="courseBody">

            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="../../js/auth.js"></script>
  <script type="module" src="../../js/pages/hod/courses.js"></script>
</body>

</html>
